[project]
name = "probabilistic-activation-oracles"
version = "0.1.0"
description = "Uncertainty quantification for activation oracles via MCMC power sampling"
requires-python = ">=3.10"
dependencies = [
    "scipy",
    "matplotlib",
    "numpy",
    "tqdm",
    "peft",
    "torch==2.11.0",
    "accelerate==1.13.0",
    "transformers==5.5.3",
    "einops==0.8.2",
    "flash-attn",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu130" }]
torchvision = [{ index = "pytorch-cu130" }]
torchaudio = [{ index = "pytorch-cu130" }]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pao", "pao.*"]

[tool.uv.extra-build-dependencies]
flash-attn = [{ requirement = "torch", match-runtime = true }]
