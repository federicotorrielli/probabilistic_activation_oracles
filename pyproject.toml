[project]
name = "probabilistic-activation-oracles"
version = "0.1.0"
description = "Uncertainty quantification for activation oracles via MCMC power sampling"
requires-python = ">=3.13"
dependencies = [
    "scipy",
    "matplotlib",
    "numpy",
    "tqdm",
    "peft",
    "torch==2.11.0",
    "accelerate==1.13.0",
    "transformers==5.8.0",
    "einops==0.8.2",
    "nnsight>=0.6.3",
]

[project.optional-dependencies]
flash-attn = [
    "flash-attn @ https://github.com/mjun0812/flash-attention-prebuild-wheels/releases/download/v0.9.4/flash_attn-2.8.3+cu130torch2.11-cp313-cp313-linux_x86_64.whl",
    "flash-attn-4",
    "flash-linear-attention",
    "causal-conv1d",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pao", "pao.*"]

[tool.uv]
no-build-isolation-package = [
    "causal-conv1d",
    "flash-linear-attention",
    "flash-attn-4",
]
prerelease = "allow"

[tool.uv.extra-build-dependencies]
flash-linear-attention = ["torch"]
flash-attn-4 = ["torch"]
causal-conv1d = ["torch"]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[dependency-groups]
dev = [
    "scikit-learn>=1.8.0",
]
