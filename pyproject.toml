[project]
name = "probabilistic-activation-oracles"
version = "0.1.0"
description = "Uncertainty quantification for activation oracles via MCMC power sampling"
requires-python = ">=3.13"
dependencies = [
    "scipy",
    "matplotlib",
    "numpy",
    "tqdm",
    "peft",
    "torch==2.11.0",
    "accelerate==1.13.0",
    "transformers==5.5.4",
    "einops==0.8.2",
    "flash-attn @ https://github.com/mjun0812/flash-attention-prebuild-wheels/releases/download/v0.9.4/flash_attn-2.8.3+cu130torch2.11-cp313-cp313-linux_x86_64.whl",
    "nnsight>=0.6.3",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pao", "pao.*"]
