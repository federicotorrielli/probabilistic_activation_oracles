[project]
name = "probabilistic-activation-oracles"
version = "0.1.0"
description = "Uncertainty quantification for activation oracles via MCMC power sampling"
requires-python = ">=3.10"
dependencies = [
    "scipy",
    "matplotlib",
    "numpy",
    "tqdm",
    "peft",
    "torch==2.11.0",
    "accelerate==1.13.0",
    "transformers==5.5.3",
    "einops==0.8.2",
    "flash-attn",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pao", "pao.*"]
