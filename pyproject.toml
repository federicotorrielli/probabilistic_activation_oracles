[project]
name = "probabilistic-activation-oracles"
version = "0.1.0"
description = "Uncertainty quantification for activation oracles via MCMC power sampling"
requires-python = ">=3.10"
dependencies = [
    "nl-probes",
    "scipy",
    "matplotlib",
    "torch==2.7.1",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
nl-probes = { path = "activation_oracles", editable = true }
torch = [{ index = "pytorch-cu128" }]
torchvision = [{ index = "pytorch-cu128" }]
torchaudio = [{ index = "pytorch-cu128" }]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pao", "pao.*"]

[tool.uv.extra-build-dependencies]
flash-attn = [{ requirement = "torch", match-runtime = true }]
